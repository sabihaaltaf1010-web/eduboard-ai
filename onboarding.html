<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setup | EduBoard AI</title><link rel="icon" href="assets/images/favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body data-page="onboarding"><div class="auth"><div class="card wide"><div class="logo"><svg width="56" height="56" viewBox="0 0 64 64"><path d="M32 6 6 18l26 12 26-12z" fill="#7c5cff"/><path d="M16 26v10c0 5 8 9 16 9s16-4 16-9V26l-16 8z" fill="#3b82f6"/><path d="M10 54h44" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="50" r="3" fill="#22d3ee"/></svg><h2>EduBoard AI</h2><small class="mut">Plan • Track • Prepare • Succeed</small></div><h3>Let us set up your study profile</h3><div class="bar"><i id="pg" style="width:25%"></i></div><section id="s1"><h4>Group & subjects</h4><select class="in" id="grp" onchange="gSubs()"></select><div id="sb"></div><div class="row"><input class="in sm" id="cs" placeholder="Custom subject"><button class="btn o sm" onclick="addCustom()">Add</button></div></section><section id="s2" hidden><h4>Exam information</h4><label>Exam date</label><input class="in" type="date" id="ed"><label>Daily available study hours</label><input class="in" type="number" id="dh" min="1" max="16" value="4"><label>Preferred study time</label><select class="in" id="pt"><option>Morning</option><option>Afternoon</option><option>Evening</option><option>Night</option></select></section><section id="s3" hidden><h4>Syllabus: chapters per subject</h4><div id="chs"></div><p class="mut">You can rename chapters and set difficulty later in My Syllabus.</p></section><section id="s4" hidden><h4>Select weak subjects</h4><div id="wk"></div></section><p id="msg" class="err"></p><div class="row"><button class="btn o" id="bk" style="visibility:hidden" onclick="obNav(-1)">Back</button><button class="btn" id="nx" onclick="obNav(1)">Next</button></div></div></div><script src="js/storage.js"></script><script src="js/auth.js"></script><script>obInit()</script></body></html>
